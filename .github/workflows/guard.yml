name: guard
on:
  push:
    paths: ["guard/**", ".github/workflows/guard.yml"]
  workflow_dispatch:
    inputs:
      live:
        description: Also run the guard against Mezo testnet (real transactions)
        type: boolean
        default: false
      keep_holds:
        description: Leave the held payments waiting, for the owner to decide on the dashboard
        type: boolean
        default: false

# The workflow token can only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r guard/requirements.txt pytest
      - run: python -m pytest guard/tests -q

  live:
    if: ${{ inputs.live }}
    needs: test
    runs-on: ubuntu-latest
    env:
      ETH_RPC_URL: https://rpc.test.mezo.org
      SAFE: "0x9e0Fe4b54f80A62527A7a2A19DEDd3c97e66FD3A"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pip install -r guard/requirements.txt
      - name: Guard run on Mezo testnet
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          KEEP_HOLDS: ${{ inputs.keep_holds }}
        run: |
          K="0x${DEPLOYER_KEY#0x}"
          derive() { cast keccak "$(cast concat-hex "$K" "$(cast from-utf8 "$1")")"; }
          export SELLAR_OWNER=$(cast wallet address --private-key "$K")
          export SELLAR_AGENT_KEY=$(derive agent)
          export VENDOR=$(cast wallet address --private-key "$(derive vendor)")
          python -m guard.demo_live
          echo
          if [ "$KEEP_HOLDS" = "true" ]; then
            echo "Left waiting for the owner: holds $(tr '\n' ' ' < guard-holds.txt)"
            exit 0
          fi
          for id in $(cat guard-holds.txt); do
            h=$(cast send --json --private-key "$K" $SAFE 'reject(uint256)' "$id" | jq -r .transactionHash)
            echo "Owner rejected hold $id: https://explorer.test.mezo.org/tx/$h"
          done
