name: faucet
on:
  workflow_dispatch:
    inputs:
      fund:
        description: MUSD to send to the faucet
        default: "500"

jobs:
  faucet:
    runs-on: ubuntu-latest
    env:
      ETH_RPC_URL: https://rpc.test.mezo.org
      MUSD: "0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503"
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --match-contract SellarFaucetTest
      - name: Deploy, fund and verify the testnet faucet
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: |
          export PRIVATE_KEY="0x${DEPLOYER_KEY#0x}"
          forge script script/DeployFaucet.s.sol --rpc-url mezo_testnet --broadcast | tee deploy.log
          FAUCET=$(grep -o 'SellarFaucet 0x[0-9a-fA-F]\{40\}' deploy.log | awk '{print $2}')
          echo "FAUCET=$FAUCET"
          H=$(cast send --json --private-key "$PRIVATE_KEY" $MUSD 'transfer(address,uint256)' "$FAUCET" "$(cast to-wei ${{ inputs.fund }} ether)" | jq -r .transactionHash)
          echo "funded: https://explorer.test.mezo.org/tx/$H"
          echo "remaining drips: $(cast call "$FAUCET" 'remaining()(uint256)')"
          forge verify-contract "$FAUCET" src/SellarFaucet.sol:SellarFaucet --chain 31611 --verifier sourcify --watch || true
          forge verify-contract "$FAUCET" src/SellarFaucet.sol:SellarFaucet --chain 31611 --verifier blockscout --verifier-url https://api.explorer.test.mezo.org/api/ --guess-constructor-args --watch || true
