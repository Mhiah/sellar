name: deploy
on:
  workflow_dispatch:
    inputs:
      fund_faucet:
        description: MUSD to send to the new faucet (0 to skip)
        default: "300"

# The workflow token can only read the repository.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ETH_RPC_URL: https://rpc.test.mezo.org
      MUSD: "0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503"
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test --no-match-contract ForkTest
      - name: Deploy to Mezo testnet
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
          FUND: ${{ inputs.fund_faucet }}
        run: |
          # Inputs are passed as environment values and checked, never pasted into the script.
          case "$FUND" in ''|*[!0-9]*) echo "fund_faucet must be a whole number"; exit 1;; esac
          # Wallets export keys without the 0x prefix; accept either form.
          export PRIVATE_KEY="0x${DEPLOYER_KEY#0x}"
          forge script script/Deploy.s.sol --rpc-url mezo_testnet --broadcast | tee deploy.log
          get() { grep -o "$1 0x[0-9a-fA-F]\{40\}" deploy.log | awk '{print $2}'; }
          SHIELD=$(get SellarShield); SAFE=$(get SellarSafe); FAUCET=$(get SellarFaucet)
          echo "ADDRESSES shield=$SHIELD safe=$SAFE faucet=$FAUCET"
          echo "deployed at block $(cast block-number)"
          if [ "$FUND" != "0" ]; then
            H=$(cast send --json --private-key "$PRIVATE_KEY" $MUSD 'transfer(address,uint256)' "$FAUCET" "$(cast to-wei "$FUND" ether)" | jq -r .transactionHash)
            echo "faucet funded: https://explorer.test.mezo.org/tx/$H"
            echo "faucet drips: $(cast call "$FAUCET" 'remaining()(uint256)')"
          fi
          for pair in "$SHIELD:SellarShield" "$SAFE:SellarSafe" "$FAUCET:SellarFaucet"; do
            A="${pair%%:*}"; N="${pair##*:}"
            forge verify-contract "$A" "src/$N.sol:$N" --chain 31611 --verifier sourcify --watch || true
            forge verify-contract "$A" "src/$N.sol:$N" --chain 31611 --verifier blockscout --verifier-url https://api.explorer.test.mezo.org/api/ --guess-constructor-args --watch || true
          done
      - name: Keep the deployment record
        uses: actions/upload-artifact@v4
        with:
          name: broadcast
          path: contracts/broadcast
